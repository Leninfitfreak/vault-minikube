global:
  namespace: monitoring

prometheus:
  image: prom/prometheus:v3.5.0
  serviceAccount:
    name: prometheus

vaultAgent:
  image: hashicorp/vault:1.20

grafana:
  image: grafana/grafana-enterprise:12.2.0
  jwt:
    enabled: true
    issuer: https://keycloak-jwt-poc:8443/realms/grafana-jwt-poc
    audience: grafana-platform
    client: jenkins-grafana-platform
    caConfigMap: keycloak-jwks-ca

  ldap:
    enabled: true
    host: DC01.ad.lab.test
    port: 636
    caConfigMap: grafana-ldap-ca
    caFile: ADLab-Root-CA.pem
    hostAliases:
      - ip: "192.168.86.128"
        hostnames:
          - "dc01.ad.lab.test"
