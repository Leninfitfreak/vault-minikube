apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.global.namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: vault

        metrics_path: /v1/sys/metrics

        params:
          format:
            - prometheus

        authorization:
          type: Bearer
          credentials_file: /vault-token/token

        static_configs:
          - targets:
              - vault-0.vault-internal.vault.svc.cluster.local:8200
              - vault-1.vault-internal.vault.svc.cluster.local:8200
              - vault-2.vault-internal.vault.svc.cluster.local:8200
