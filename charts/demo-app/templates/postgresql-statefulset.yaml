apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.postgresql.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  serviceName: {{ .Values.postgresql.name }}
  replicas: 1

  selector:
    matchLabels:
      app: {{ .Values.postgresql.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.postgresql.name }}

    spec:
      serviceAccountName: {{ .Values.postgresql.name }}

      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}

          ports:
            - name: postgresql
              containerPort: {{ .Values.postgresql.port }}

          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgresql.name }}
                  key: username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgresql.name }}
                  key: password

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 30
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
