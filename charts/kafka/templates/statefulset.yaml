apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.kafka.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  serviceName: kafka-headless
  replicas: {{ .Values.kafka.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.kafka.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.kafka.name }}

    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}

          ports:
            - name: broker
              containerPort: {{ .Values.kafka.ports.client }}

            - name: controller
              containerPort: {{ .Values.kafka.ports.controller }}

          command:
            - /bin/bash
            - -ec
            - |
              ORDINAL="${HOSTNAME##*-}"

              export KAFKA_NODE_ID="${ORDINAL}"

              export KAFKA_ADVERTISED_LISTENERS="BROKER://${HOSTNAME}.kafka-headless.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.kafka.ports.client }}"

              exec /etc/confluent/docker/run

          env:
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka-headless.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.kafka.ports.controller }},1@kafka-1.kafka-headless.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.kafka.ports.controller }},2@kafka-2.kafka-headless.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.kafka.ports.controller }}"

            - name: KAFKA_LISTENERS
              value: "BROKER://0.0.0.0:{{ .Values.kafka.ports.client }},CONTROLLER://0.0.0.0:{{ .Values.kafka.ports.controller }}"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "BROKER"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: {{ .Values.kafka.replication.defaultReplicationFactor | quote }}

            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: {{ .Values.kafka.replication.minInSyncReplicas | quote }}

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: {{ .Values.kafka.replication.offsetsTopicReplicationFactor | quote }}

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: {{ .Values.kafka.replication.transactionStateLogReplicationFactor | quote }}

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: {{ .Values.kafka.replication.transactionStateLogMinIsr | quote }}

            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"

          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data

          resources:
{{ toYaml .Values.kafka.resources | indent 12 }}

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.kafka.storage.size }}
